site_name: tsne-h2pack
site_description: Linear-time t-SNE with H² matrix acceleration. A drop-in replacement for sklearn.manifold.TSNE.
site_author: Xin Xing
site_url: https://xinxing02.github.io/tsne-h2pack-python/
repo_url: https://github.com/xinxing02/tsne-h2pack-python
repo_name: GitHub
edit_uri: ""
docs_dir: website
site_dir: _site
copyright: "&copy; Copyright 2026, tsne-h2pack contributors."

theme:
  name: readthedocs
  collapse_navigation: false
  navigation_depth: 3
  sticky_navigation: true
  titles_only: false
  prev_next_buttons_location: bottom
  highlightjs: true
  hljs_languages: [python, bash, yaml]

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: "¶"
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            docstring_section_style: list
            show_source: false
            show_root_heading: true
            heading_level: 2
            members_order: source
            filters: ["!^_"]
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

nav:
  - Home: index.md
  - User Guide:
      - Installation: installation.md
      - Quick start: quickstart.md
      - How to use tsne-h2pack: user-guide.md
      - How it works: technical/algorithm.md
      - Accuracy and reproducibility: technical/accuracy.md
      - Benchmarks: benchmarks.md
  - API Reference:
      - API reference: api.md
  - More:
      - Troubleshooting: troubleshooting.md
      - Changelog: changelog.md
      - Citing: citing.md
