name: Build wheels

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Manual runs from the Actions tab: test CI changes, or dry-run a release
  # by uploading the artifacts to TestPyPI (tick the box).
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: 'Upload the built sdist + wheels to TestPyPI'
        type: boolean
        default: false

jobs:
  build_wheels:
    name: Build wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 = Apple Silicon (arm64; macos-14 was retired on 2026-11-02). Linux x86_64 from
        # ubuntu-latest (Linux aarch64 is not built; see docs/PACKAGING_GUIDE.md).
        os: [ubuntu-latest, macos-15]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build wheels
        # Pin to a specific recent release. cibuildwheel does NOT ship
        # floating major-version tags (`@v2`, `@v3`) — only specific
        # release tags like `v3.4.1`. Bump this manually as new
        # versions land. The pyproject.toml manylinux-image override
        # ensures we don't depend on whatever image this version of
        # cibuildwheel happens to default to.
        uses: pypa/cibuildwheel@v3.4.1
        env:
          # See [tool.cibuildwheel] in pyproject.toml for the bulk of the
          # configuration; only env-var-shaped settings live here.
          CIBW_ENVIRONMENT_MACOS: >-
            MACOSX_DEPLOYMENT_TARGET=15.0
            KMP_DUPLICATE_LIB_OK=TRUE

      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          retention-days: 7

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist

      - name: Upload sdist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz
          retention-days: 7

  # Dry run: manual dispatch with the box ticked uploads to TestPyPI. Needs a
  # trusted publisher registered on test.pypi.org for workflow `wheels.yml`,
  # environment `testpypi`. TestPyPI never accepts the same version twice, so
  # skip-existing keeps a repeated dry run from failing (it re-uploads nothing).
  publish_testpypi:
    name: Publish to TestPyPI (dry run)
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish_testpypi
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files about to upload
        run: ls -l dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # On a v* tag push, collect everything and upload to PyPI.
  # Configure trusted publishing on PyPI:
  # https://docs.pypi.org/trusted-publishers/
  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files about to upload
        run: ls -l dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
