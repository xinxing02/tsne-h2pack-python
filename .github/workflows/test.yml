name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        # Every CPython the package supports (requires-python >= 3.10). Dependency versions
        # differ per Python (3.10 tops out at numpy 2.2), so each one is tested.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        # macos-15 = Apple Silicon (macos-14 was retired on 2026-11-02).

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc libopenblas-dev liblapack-dev liblapacke-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc openblas
          # Make Homebrew GCC discoverable to setup.py
          ls /opt/homebrew/bin/gcc-* || true

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          # The pynndescent extra, as users install it: its version pin differs per Python.
          pip install -e '.[pynndescent]'
          pip install pytest pytest-timeout
          # Optional k-NN backends: their tests skip when a wheel is missing for this Python.
          pip install faiss-cpu || echo "faiss-cpu not available for this Python"
          pip install annoy || echo "annoy not available for this Python"

      - name: Verify backend
        run: |
          python -c "import tsne_h2pack; print('Version:', tsne_h2pack.__version__)"
          python -c "from tsne_h2pack._backend import get_backend; b=get_backend(); assert b.is_available(), 'native backend not available'; print('Backend OK')"

      - name: Defaults on 20K points (PyNNDescent NN-descent path, PCA init)
        run: |
          python -c "import numpy as np; from tsne_h2pack import TSNE; Y = TSNE(max_iter=100, random_state=0).fit_transform(np.random.RandomState(0).randn(20000, 50)); assert Y.shape == (20000, 2) and np.isfinite(Y).all(); print('defaults at 20K OK')"

      - name: Run pytest
        # Skip slow tests in the per-PR Test workflow. The 10K-sample
        # integration test (TestLargerScaleIntegration) is marked slow
        # and aborted under macos-14 CI (passes locally) —
        # likely a thread-count/OpenBLAS interaction worth a separate
        # investigation, not a per-PR blocker.
        # Annoy tests skip cleanly on Python 3.13+ (handled by the
        # fixture in tests/conftest.py) — no manual deselect required.
        run: pytest tests/ -v --tb=short -m "not slow"
