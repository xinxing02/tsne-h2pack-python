# H²Pack Profiling Test Suite Configuration
# pytest configuration for profiling tests

[tool:pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for selective test execution
markers =
    slow: marks tests as slow (require significant time, deselect with '-m "not slow"')
    small: tests on small datasets (10K samples)
    medium: tests on medium datasets (60K-100K samples)
    large: tests on large datasets (200K+ samples)
    comparison: full comparison across all dataset sizes

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Timeout for individual tests (in seconds)
timeout = 1800

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S

# Coverage (optional)
# addopts = --cov=tsne_h2pack --cov-report=html
